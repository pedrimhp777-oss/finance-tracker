name: Backend CI

on:
  push:
    paths: ["**"]
    branches: [main, professionalization]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (banco isolado em memória)
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
        run: python -m pytest -q

      - name: Validate Alembic migration in isolated SQLite
        env:
          DATABASE_URL: sqlite:////tmp/ci-migration-test.db
        run: alembic upgrade head
